name: AKS CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ==============================
  # STAGE 1 - TERRAFORM
  # ==============================
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Prepare Terraform variables
        working-directory: terraform
        env:
          TF_POSTGRES_ADMIN_PASSWORD: ${{ secrets.TF_POSTGRES_ADMIN_PASSWORD }}
        run: |
          cp terraform.tfvars.example terraform.tfvars
          printf '\npostgres_admin_password = "%s"\n' "$TF_POSTGRES_ADMIN_PASSWORD" >> terraform.tfvars

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve


  # ==============================
  # STAGE 2 - BUILD AND PUSH
  # ==============================
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name pallaviacr

      - name: Build Docker Image
        run: |
          docker build \
            -t pallaviacr.azurecr.io/python-k8s-app:${{ github.sha }} \
            .

      - name: Push Docker Image
        run: |
          docker push \
            pallaviacr.azurecr.io/python-k8s-app:${{ github.sha }}


  # ==============================
  # STAGE 3 - AKS DEPLOYMENT
  # ==============================
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group pallavi-rg \
            --name pallavi-aks \
            --overwrite-existing

      # Create Secret BEFORE Deployment
      - name: Create PostgreSQL Secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.TF_POSTGRES_ADMIN_PASSWORD }}
        run: |
          kubectl create secret generic postgres-secret \
            --namespace python-app \
            --from-literal=password="$POSTGRES_PASSWORD" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/python-app \
            python-app=pallaviacr.azurecr.io/python-k8s-app:${{ github.sha }} \
            -n python-app

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/python-app \
            -n python-app \
            --timeout=300s

  # ==============================
  # STAGE 4 - VERIFY
  # ==============================
  verify:
    name: Verify AKS Deployment
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group pallavi-rg \
            --name pallavi-aks \
            --overwrite-existing

      - name: Verify Pods
        run: |
          kubectl get pods -n python-app

      - name: Verify Service
        run: |
          kubectl get service python-app-service -n python-app