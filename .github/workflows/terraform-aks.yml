name: AKS CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ==========================================================
  # STAGE 1 - TERRAFORM
  # ==========================================================
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Prepare Terraform variables
        working-directory: terraform
        env:
          TF_POSTGRES_ADMIN_PASSWORD: ${{ secrets.TF_POSTGRES_ADMIN_PASSWORD }}
        run: |
          cp terraform.tfvars.example terraform.tfvars
          printf '\npostgres_admin_password = "%s"\n' "$TF_POSTGRES_ADMIN_PASSWORD" >> terraform.tfvars

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve


  # ==========================================================
  # STAGE 2 - BUILD AND PUSH
  # ==========================================================
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: terraform

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name pallaviacr

      # --------------------------------------------------------
      # BACKEND
      # --------------------------------------------------------

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t pallaviacr.azurecr.io/python-k8s-app:${{ github.sha }} \
            .

      - name: Push Backend Docker Image
        run: |
          docker push \
            pallaviacr.azurecr.io/python-k8s-app:${{ github.sha }}

      # --------------------------------------------------------
      # FRONTEND
      # --------------------------------------------------------

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t pallaviacr.azurecr.io/frontend-app:${{ github.sha }} \
            ./frontend

      - name: Push Frontend Docker Image
        run: |
          docker push \
            pallaviacr.azurecr.io/frontend-app:${{ github.sha }}


  # ==========================================================
  # STAGE 3 - AKS DEPLOYMENT
  # ==========================================================
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: docker

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group pallavi-rg \
            --name pallavi-aks \
            --overwrite-existing

      # --------------------------------------------------------
      # NAMESPACE
      # --------------------------------------------------------

      - name: Create Namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      # --------------------------------------------------------
      # POSTGRES SECRET
      # --------------------------------------------------------

      - name: Create PostgreSQL Secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.TF_POSTGRES_ADMIN_PASSWORD }}
        run: |
          kubectl create secret generic postgres-secret \
            --namespace python-app \
            --from-literal=password="$POSTGRES_PASSWORD" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # --------------------------------------------------------
      # KUBERNETES DEPLOYMENTS
      # --------------------------------------------------------

      - name: Apply Kubernetes Deployments
        run: |
          kubectl apply -f k8s/deployment.yaml

      # --------------------------------------------------------
      # KUBERNETES SERVICES
      # --------------------------------------------------------

      - name: Apply Kubernetes Services
        run: |
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/frontend-service.yaml

      # --------------------------------------------------------
      # INGRESS
      # --------------------------------------------------------

      - name: Apply Kubernetes Ingress
        run: |
          kubectl apply -f k8s/ingress.yaml

      # --------------------------------------------------------
      # UPDATE BACKEND IMAGE
      # --------------------------------------------------------

      - name: Update Backend Deployment Image
        run: |
          kubectl set image deployment/python-app \
            python-app=pallaviacr.azurecr.io/python-k8s-app:${{ github.sha }} \
            -n python-app

      # --------------------------------------------------------
      # UPDATE FRONTEND IMAGE
      # --------------------------------------------------------

      - name: Update Frontend Deployment Image
        run: |
          kubectl set image deployment/frontend \
            frontend=pallaviacr.azurecr.io/frontend-app:${{ github.sha }} \
            -n python-app

      # --------------------------------------------------------
      # BACKEND ROLLOUT
      # --------------------------------------------------------

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status deployment/python-app \
            -n python-app \
            --timeout=300s

      # --------------------------------------------------------
      # FRONTEND ROLLOUT
      # --------------------------------------------------------

      - name: Wait for Frontend Rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n python-app \
            --timeout=300s

      # --------------------------------------------------------
      # WAIT FOR AGIC
      # --------------------------------------------------------

      - name: Wait for Ingress Address
        run: |
          for i in {1..30}; do
            ADDRESS=$(kubectl get ingress python-app-ingress \
              -n python-app \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$ADDRESS" ]; then
              echo "Application Gateway IP: $ADDRESS"
              break
            fi

            echo "Waiting for Application Gateway..."
            sleep 10
          done


  # ==========================================================
  # STAGE 4 - VERIFY
  # ==========================================================
  verify:
    name: Verify AKS Deployment
    runs-on: ubuntu-latest
    needs: deploy

    steps:

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group pallavi-rg \
            --name pallavi-aks \
            --overwrite-existing

      # --------------------------------------------------------
      # VERIFY PODS
      # --------------------------------------------------------

      - name: Verify Pods
        run: |
          kubectl get pods -n python-app

      # --------------------------------------------------------
      # VERIFY DEPLOYMENTS
      # --------------------------------------------------------

      - name: Verify Deployments
        run: |
          kubectl get deployments -n python-app

      # --------------------------------------------------------
      # VERIFY SERVICES
      # --------------------------------------------------------

      - name: Verify Services
        run: |
          kubectl get services -n python-app

      # --------------------------------------------------------
      # VERIFY INGRESS
      # --------------------------------------------------------

      - name: Verify Ingress
        run: |
          kubectl get ingress -n python-app

      # --------------------------------------------------------
      # VERIFY ENDPOINTS
      # --------------------------------------------------------

      - name: Verify Endpoints
        run: |
          kubectl get endpoints -n python-app

      # --------------------------------------------------------
      # VERIFY APPLICATION GATEWAY
      # --------------------------------------------------------

      - name: Verify Application Gateway
        run: |
          az network application-gateway show \
            --resource-group pallavi-rg \
            --name pallavi-appgw \
            --query "{name:name,frontendIP:frontendIPConfigurations[0].publicIPAddress.id}" \
            -o json