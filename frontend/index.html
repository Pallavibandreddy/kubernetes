<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>User Management</h1>
            <p class="subtitle">Create and manage users</p>

            <form id="userForm">

                <div class="form-group">
                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="age">Age</label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter your age"
                        min="1"
                        max="120"
                        required
                    >
                </div>

                <button type="submit">
                    Create User
                </button>

            </form>

            <p id="message"></p>

        </div>


        <div class="users-card">

            <div class="users-header">
                <h2>Users</h2>

                <button
                    class="refresh-btn"
                    onclick="loadUsers()"
                >
                    Refresh
                </button>
            </div>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                    </tr>
                </thead>

                <tbody id="usersTable">
                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
