# ============================================================
# BACKEND DEPLOYMENT
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-app
  namespace: python-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-app

  template:
    metadata:
      labels:
        app: python-app

    spec:
      containers:
        - name: python-app

          image: pallaviacr.azurecr.io/python-k8s-app:v1

          ports:
            - containerPort: 8000

          env:
            - name: DB_HOST
              value: "pallavi.postgres.database.azure.com"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: "myapp"

            - name: DB_USER
              value: "pgadmin"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"


---

# ============================================================
# FRONTEND DEPLOYMENT
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: python-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: pallaviacr.azurecr.io/frontend-app:v1

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "256Mi"